schema_version: 1

context:
  name: uxsim
  version: "1.15.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/uxsim-${{ version }}.tar.gz
  sha256: 9abfd3b6bd9c2a106dd4de59049f7825d06bfb6fa2d9f8f1de57bc61bd6dd01a

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler("cxx") }}
    - cmake
    - if: win
      then: ninja
      else: make
  host:
    - python
    - scikit-build-core >=0.9
    - nanobind
    - pip
  run:
    - python
    - numpy >=1.21.5
    - matplotlib-base >=3.5.2
    - pillow >=9.2.0
    - tqdm >=4.64.1
    - scipy >=1.9.1
    - pandas >=1.4.4
    - dill >=0.3.9
    - networkx >=3.2.1

tests:
  - python:
      imports:
        - uxsim
      pip_check: true

about:
  summary: Vehicular traffic flow simulator in road network, written in pure Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/toruseo/UXsim
  documentation: https://toruseo.jp/UXsim/docs/index.html

extra:
  recipe-maintainers:
    - thewchan
